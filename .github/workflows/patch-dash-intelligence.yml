name: Patch Dash Intelligence
on:
  push:
    paths:
      - 'scripts/patch-dash-intelligence.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch-dash-intelligence.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git commit -m 'Improve LookLiP Dash expense intelligence' || exit 0
          git push
