name: Apply LookLiP Dash
on:
  push:
    paths:
      - 'scripts/patch-dash-intelligence.py'
      - 'src/main.jsx'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Dash
        run: python3 scripts/patch-dash-intelligence.py
      - name: Validate build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git diff --cached --quiet || git commit -m 'Improve LookLiP Dash expense intelligence'
          git push
