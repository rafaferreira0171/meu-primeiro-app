name: Apply LookLiP Dash
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-dash.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch Dash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx'); s=p.read_text()
          a=s.index('function Dash({data}){'); b=s.index("createRoot(document.getElementById('root')).render(<App/>)",a)
          new=r'''function Dash({data}){const[dashTab,setDashTab]=useState('fluxo');return <><div className="dashhead"><h1>LookLiP Dash</h1><p>Leitura executiva do seu financeiro.</p></div><div className="dash-tabs"><button className={dashTab==='fluxo'?'active':''} onClick={()=>setDashTab('fluxo')}>Dash Fluxo</button><button className={dashTab==='budget'?'active':''} onClick={()=>setDashTab('budget')}>Dash Entradas x Budget</button></div>{dashTab==='fluxo'?<DashFluxo data={data}/>:<DashBudget data={data}/>}</>}
function DashFluxo({data}){const now=currentMonth(),months=planningMonths(now,12),rows=months.map(m=>{const f=data.fluxo.find(x=>x.month===m)||{},p=data.prestadores.filter(x=>x.month===m&&x.ativo!==false),d=data.despesas.filter(x=>x.month===m&&x.ativo!==false),e=data.entradas.filter(x=>x.month===m&&x.ativo!==false);return{month:m,...calcFluxoMonth(f,p,d,e)}}),cur=rows[0]||{entries:0,expenses:0,balance:0},future=rows.slice(1),avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0,commit=cur.entries?cur.expenses/cur.entries*100:0,worst=future.length?future.reduce((a,b)=>a.balance<b.balance?a:b):null,best=future.length?future.reduce((a,b)=>a.balance>b.balance?a:b):null,negative=future.filter(x=>x.balance<0),top={};months.forEach(m=>{const f=data.fluxo.find(x=>x.month===m)||{};FLUXO_FIELDS.forEach(([k,l])=>{top[l]=(top[l]||0)+Number(f[k]||0)});data.despesas.filter(d=>d.month===m&&d.ativo!==false).forEach(d=>top[d.nome]=(top[d.nome]||0)+Number(d.valor||0));data.prestadores.filter(p=>p.month===m&&p.ativo!==false).forEach(p=>top['Prestadores de Serviço']=(top['Prestadores de Serviço']||0)+totalPrestador(p))});const top5=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);return <><div className="kpis"><Kpi t="Entradas do mês" v={cur.entries}/><Kpi t="Despesas do mês" v={cur.expenses}/><Kpi t="Saldo do mês" v={cur.balance}/><Kpi t="Comprometimento" v={commit}/></div><div className="grid2"><Section title="Visão dos próximos 12 meses"><div className="note">Atual + 11 meses planejados. Histórico preservado.</div>{rows.map(r=><div className="dash-month" key={r.month}><div><b>{r.month}</b><small>{r.month===now?'Atual':'Planejado'}</small></div><span>{BRL(r.entries)}</span><span>{BRL(r.expenses)}</span><strong className={r.balance<0?'negative':''}>{BRL(r.balance)}</strong></div>)}</Section><Section title="Leitura executiva"><div className="dash-insight"><b>Média mensal futura</b><span>Entradas {BRL(avg(future.map(x=>x.entries)))} · Despesas {BRL(avg(future.map(x=>x.expenses)))}</span></div>{worst&&<div className="dash-insight"><b>Maior pressão</b><span>{worst.month} · saldo projetado {BRL(worst.balance)}</span></div>}{best&&<div className="dash-insight"><b>Melhor mês projetado</b><span>{best.month} · saldo {BRL(best.balance)}</span></div>}<div className="dash-insight"><b>Concentração</b><span>{top5.slice(0,3).map(x=>x[0]).join(' · ')}</span></div>{negative.length>0&&<div className="alert">Atenção: {negative.length} mês(es) futuro(s) com saldo negativo.</div>}</Section></div><Section title="Principais despesas — janela planejada"><div className="dash-ranking">{top5.map(([name,value],i)=><div key={name}><span><b>{i+1}</b>{name}</span><strong>{BRL(value)}</strong></div>)}</div></Section><Section title="Evolução mensal"><div className="dash-trend">{rows.map(r=><div key={r.month}><span>{r.month.slice(5)}</span><i style={{height:`${Math.max(8,Math.min(100,Math.abs(r.balance)/(Math.max(...rows.map(x=>Math.abs(x.balance)),1))*100))}%`}} className={r.balance<0?'negative':''}/><small>{BRL(r.balance)}</small></div>)}</div></Section></>}
function DashBudget({data}){const now=currentMonth(),months=planningMonths(now,12),rows=months.map(m=>{const accounts=data.budgetAccounts.filter(a=>a.month===m&&a.ativo!==false),cards=calcBudgetMonth(data.gastos,m,accounts),budget=cards.reduce((s,a)=>s+Number(a.budget||0),0),spent=cards.reduce((s,a)=>s+a.spent,0);return{month:m,budget,spent,balance:budget-spent,cards}}),cur=rows[0]||{budget:0,spent:0,balance:0,cards:[]},usage=cur.budget?cur.spent/cur.budget*100:0,rank=[...cur.cards].sort((a,b)=>b.spent-a.spent),overs=rank.filter(a=>a.spent>a.budget),totalBudget=rows.reduce((s,x)=>s+x.budget,0),totalSpent=rows.reduce((s,x)=>s+x.spent,0),avgUsage=totalBudget?totalSpent/totalBudget*100:0;return <><div className="kpis"><Kpi t="Budget do mês" v={cur.budget}/><Kpi t="Realizado" v={cur.spent}/><Kpi t="Saldo disponível" v={cur.balance}/><Kpi t="Uso do Budget" v={usage}/></div><div className="grid2"><Section title="Budget atual"><div className="note">Controle independente do Fluxo.</div>{rank.map(a=><div className="budget-insight" key={a.id}><div><b>{a.nome}</b><small>{a.budget?`${(a.spent/a.budget*100).toFixed(0)}% utilizado`:'Sem limite'}</small></div><span>{BRL(a.spent)} / {BRL(a.budget)}</span><strong className={a.balance<0?'negative':''}>{BRL(a.balance)}</strong></div>)}</Section><Section title="Leitura do Budget"><div className="dash-insight"><b>Utilização média da janela</b><span>{avgUsage.toFixed(1)}% dos Budgets consumidos</span></div><div className="dash-insight"><b>Maior consumo no mês</b><span>{rank[0]?`${rank[0].nome} · ${BRL(rank[0].spent)}`:'Nenhum lançamento'}</span></div><div className="dash-insight"><b>Saldo acumulado planejado</b><span>{BRL(rows.reduce((s,x)=>s+x.balance,0))}</span></div>{overs.length>0&&<div className="alert">{overs.length} categoria(s) ultrapassaram o Budget em {now}.</div>}</Section></div><Section title="Budget x realizado — 12 meses"><div className="budget-trend">{rows.map(r=><div key={r.month}><span>{r.month.slice(5)}</span><div><i style={{width:`${Math.min(100,r.budget?Math.max(0,r.spent/r.budget*100):0)}%`}}/><b>{BRL(r.spent)}</b><small>de {BRL(r.budget)}</small></div></div>)}</div></Section><Section title="Categorias que mais consomem Budget"><div className="dash-ranking">{rank.slice(0,6).map((a,i)=><div key={a.id}><span><b>{i+1}</b>{a.nome}</span><strong>{BRL(a.spent)}</strong></div>)}</div></Section></>}
'''
          p.write_text(s[:a]+new+s[b:])
          css=Path('src/styles.css'); c=css.read_text()
          if '.dash-tabs{' not in c:
            c+='''.dash-tabs{display:flex;gap:8px;background:#fff;border:1px solid #e4e8ee;border-radius:14px;padding:5px;margin-bottom:20px}.dash-tabs button{border:0;background:transparent;color:#657080;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.dash-tabs button.active{background:#3972e8;color:#fff}.dash-month{display:grid;grid-template-columns:1.1fr .9fr .9fr .9fr;gap:8px;align-items:center;border-bottom:1px solid #eef1f4;padding:11px 0;font-size:12px}.dash-month>div{display:flex;gap:7px;align-items:center}.dash-month small,.budget-insight small{color:#8a929e;font-size:10px}.negative{color:#d94b4b!important}.dash-insight{padding:13px 0;border-bottom:1px solid #eef1f4}.dash-insight b{display:block;font-size:13px;margin-bottom:4px}.dash-insight span{font-size:12px;color:#697384}.dash-ranking>div{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef1f4}.dash-ranking span{display:flex;gap:10px;align-items:center;font-size:13px}.dash-ranking span b{display:grid;place-items:center;width:23px;height:23px;border-radius:7px;background:#eef3ff;color:#3972e8;font-size:11px}.dash-trend{height:190px;display:flex;gap:8px;align-items:end;padding-top:15px}.dash-trend>div{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:5px;min-width:0}.dash-trend i{display:block;width:100%;max-width:34px;background:#3972e8;border-radius:7px 7px 2px 2px;min-height:7px}.dash-trend small{font-size:8px;color:#697384;white-space:nowrap}.dash-trend span{font-size:9px;color:#8a929e}.budget-insight{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eef1f4;font-size:12px}.budget-insight span{font-weight:600}.budget-trend>div{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;padding:9px 0}.budget-trend>div>span{font-size:10px;color:#8a929e}.budget-trend>div>div{position:relative;background:#f1f3f6;border-radius:8px;height:28px;display:flex;align-items:center;padding:0 9px;overflow:hidden}.budget-trend i{position:absolute;left:0;top:0;bottom:0;background:#3972e8;opacity:.18}.budget-trend b,.budget-trend small{position:relative;z-index:1}.budget-trend small{margin-left:auto;font-size:9px;color:#697384}@media(max-width:800px){.dash-month{grid-template-columns:1fr 1fr}.dash-month strong{grid-column:2}.budget-insight{grid-template-columns:1fr auto}.budget-insight strong{grid-column:2}}\n'''
            css.write_text(c)
          PY
      - name: Validate
        run: npm install && npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/styles.css
          git diff --cached --quiet || git commit -m 'Build LookLiP Dash Fluxo and Budget'
          git push
