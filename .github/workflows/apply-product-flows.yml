name: Apply LookLiP product-flow patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-product-flows.py'
      - '.github/workflows/apply-product-flows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/patch-product-flows.py
      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git commit -m 'Refine month-aware product flows'
          git push
