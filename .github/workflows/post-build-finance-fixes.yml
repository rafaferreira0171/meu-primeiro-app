name: Post-build Finance fixes

on:
  workflow_run:
    workflows: ["Build LookLiP Finance"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          if 'const fluxoByMonth=new Map();' not in s:
              needle="const now=currentMonth();"
              insert="const fluxoByMonth=new Map();for(const row of d.fluxo){const prev=fluxoByMonth.get(row.month);fluxoByMonth.set(row.month,prev?{...prev,...row,id:prev.id||row.id}:row)}d.fluxo=[...fluxoByMonth.values()];"
              if needle not in s: raise SystemExit('normalizeData marker not found')
              s=s.replace(needle,insert+needle,1)
          p.write_text(s)

          q=Path('scripts/patch-finance-assistant.py')
          t=q.read_text()
          if 'let financeRecognizer=null;' not in t:
              t=t.replace("function FinanceAssistant({data,save,month}){", "let financeRecognizer=null;\nfunction FinanceAssistant({data,save,month}){", 1)
          old_voice="const startVoice=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setMessage('Seu navegador não disponibilizou reconhecimento de voz. Use o campo de texto ou o ditado do teclado.');return}const r=new SR();r.lang='pt-BR';r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>setListening(true);r.onend=()=>setListening(false);r.onerror=()=>{setListening(false);setMessage('Não consegui ouvir. Tente novamente.')};r.onresult=e=>{const heard=e.results?.[0]?.[0]?.transcript||'';setText(heard);setTimeout(()=>{const d=parse(heard);if(d?.account){setDraft(d);setMessage('Confira o lançamento antes de confirmar.')}else if(d){setDraft(d);setMessage('Identifiquei o valor, mas não encontrei o Budget. Escolha uma conta abaixo.')}} ,0)};r.start()};"
          new_voice="const startVoice=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setMessage('Seu navegador não disponibilizou reconhecimento de voz. Use o campo de texto ou o ditado do teclado.');return}if(listening)return;setMessage('');let r=financeRecognizer;if(!r){r=new SR();financeRecognizer=r;r.lang='pt-BR';r.continuous=false;r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>setListening(true);r.onend=()=>setListening(false);r.onerror=e=>{setListening(false);if(e?.error!=='aborted')setMessage('Não consegui ouvir. Tente novamente.')};r.onresult=e=>{const heard=e.results?.[0]?.[0]?.transcript||'';setText(heard);setListening(false);const d=parse(heard);if(d?.account){setDraft(d);setMessage('Confira o lançamento antes de confirmar.')}else if(d){setDraft(d);setMessage('Identifiquei o valor, mas não encontrei o Budget. Escolha uma conta abaixo.')}else setMessage('Não identifiquei o valor. Tente novamente.')}}try{r.start()}catch(e){setListening(false)}};"
          if old_voice in t: t=t.replace(old_voice,new_voice,1)
          old_open="onClick={()=>{setOpen(true);setMessage('');startVoice()}} aria-label=\"Abrir Finance\""
          if old_open in t: t=t.replace(old_open,"onClick={()=>{setOpen(true);setText('');setDraft(null);setMessage('')}} aria-label=\"Abrir Finance\"",1)
          q.write_text(t)
          print('Fixes applied')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx scripts/patch-finance-assistant.py
          git commit -m "Fix Fluxo duplicate keys and voice permission UX"
          git push
