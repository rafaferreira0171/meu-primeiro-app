name: Validate Prestadores to Fluxo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch Prestadores to Fluxo integration
        run: python3 scripts/patch_prestadores_fluxo.py
      - run: npm install --no-audit --no-fund
      - name: Validate planning and history rules
        run: node scripts/planning-guard.mjs
      - run: npm run build
      - name: Commit source fixes
        run: |
          if git diff --quiet -- src/main.jsx src/lib/finance.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/lib/finance.js
          git commit -m 'Fix Prestadores as Fluxo expense reference'
          git push
