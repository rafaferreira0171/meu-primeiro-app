name: Build LookLiP Finance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore missing Finance components
        run: python scripts/restore-components.py
      - name: Apply provider Fluxo percentage control
        run: python scripts/patch-prestadores-percent.py
      - name: Apply editable tax field
        run: python scripts/patch-imposto-editavel.py
      - name: Apply transfer provider option
        run: python scripts/patch-transferencias-prestadores.py
      - name: Apply canonical month selectors
        run: python scripts/patch-month-selectors.py
      - name: Apply Budget account deletion
        run: python scripts/patch-budget-default-delete.py
      - name: Apply month-only Fluxo expense exclusion
        run: python scripts/patch-fluxo-exclusao.py
      - name: Apply mobile layout refinement
        run: python scripts/patch-mobile-layout.py
      - name: Apply refined visual hierarchy
        run: python scripts/patch-visual-layout.py
      - name: Apply dashboard insights and charts
        run: python scripts/patch-dashboard-insights.py
      - name: Apply dashboard KPI formatting
        run: python scripts/patch-dashboard-kpi.py
      - name: Apply dashboard action priorities
        run: python scripts/patch-dashboard-actions.py
      - name: Apply Finance assistant
        run: python scripts/patch-finance-assistant.py
      - name: Apply current month across all tabs
        run: python scripts/patch-current-month-all-tabs.py
      - name: Apply provider future-month edit propagation
        run: python scripts/patch-provider-future-edits.py
      - name: Apply future-month recurrence rules
        run: python scripts/patch-recurring-future-rules.py
      - name: Apply iPhone login zoom fix
        run: python scripts/patch-ios-login-zoom.py
      - name: Validate restored Finance JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          replacements = {
              'onChange={v=>updateFlux({[k]:v)/>': 'onChange={v=>updateFlux({[k]:v})}/>',
              'onChange={v=>updateFlux({[k]:v})/>': 'onChange={v=>updateFlux({[k]:v})}/>',
          }
          for bad, good in replacements.items():
              s = s.replace(bad, good)
          p.write_text(s)
          print('Finance JSX normalization complete')
          PY
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vite app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Verify compiled output
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q "assets/" dist/index.html
          test ! -f dist/sw.js
          echo "Compiled Vite output verified without legacy service worker"
      - name: Verify React entry is compiled
        run: |
          grep -q "createRoot" dist/assets/*.js
          grep -q "Fluxo" dist/assets/*.js
          grep -q "Considerado no Fluxo" dist/assets/*.js
          grep -q "Valor calculado" dist/assets/*.js
          grep -q "Disponível" dist/assets/*.js
          grep -q "Evolução do saldo" dist/assets/*.js
          grep -q "Imposto é editável" dist/assets/*.js
          grep -q "Prestadores de Serviço" dist/assets/*.js
          grep -q "Excluir" dist/assets/*.js
          grep -q "Leitura executiva" dist/assets/*.js
          grep -q "Pressão das despesas" dist/assets/*.js
          grep -q "Budget x realizado" dist/assets/*.js
          grep -q "Utilização" dist/assets/*.js
          grep -q "Prioridades de ação" dist/assets/*.js
          grep -q "Proteger o caixa agora" dist/assets/*.js
          grep -q "Assistente do seu dinheiro" dist/assets/*.js
          grep -q "Interpretar lançamento" dist/assets/*.js
          grep -q "SpeechRecognition" dist/assets/*.js
          grep -q "future-month" src/main.jsx
          echo "Enhanced Finance UI with recurrence, dashboard insights, action priorities, and Finance assistant is present"
      - name: Verify Supabase source fallback
        run: |
          grep -q "try" src/lib/supabase.js
          grep -q "supabase = null" src/lib/supabase.js
          echo "Defensive Supabase initialization is present in source"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4