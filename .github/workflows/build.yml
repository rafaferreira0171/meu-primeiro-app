name: Build LookLiP Finance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch Dash current-month KPI logic
        run: python3 scripts/patch_dash.py
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit Dash fix
        run: |
          if git diff --quiet -- src/main.jsx; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git commit -m 'Fix Dash current month'
          git push
