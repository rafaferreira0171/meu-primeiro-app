name: Build LookLiP Finance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore missing Finance components
        run: python scripts/restore-components.py
      - name: Apply provider Fluxo percentage control
        run: python scripts/patch-prestadores-percent.py
      - name: Apply editable tax field
        run: python scripts/patch-imposto-editavel.py
      - name: Validate restored Finance JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          bad = 'onChange={v=>updateFlux({[k]:v})/>'
          good = 'onChange={v=>updateFlux({[k]:v})}/>'
          if bad in s:
              s = s.replace(bad, good)
              p.write_text(s)
          print('Finance JSX normalization complete')
          PY
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vite app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Verify compiled output
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q "assets/" dist/index.html
          test ! -f dist/sw.js
          echo "Compiled Vite output verified without legacy service worker"
      - name: Verify React entry is compiled
        run: |
          grep -q "createRoot" dist/assets/*.js
          grep -q "Fluxo" dist/assets/*.js
          grep -q "Considerado no Fluxo" dist/assets/*.js
          grep -q "Valor calculado" dist/assets/*.js
          grep -q "Disponível" dist/assets/*.js
          grep -q "Evolução do saldo" dist/assets/*.js
          grep -q "Imposto é editável" dist/assets/*.js
          echo "Enhanced Finance UI is present in compiled assets"
      - name: Verify Supabase source fallback
        run: |
          grep -q "try" src/lib/supabase.js
          grep -q "supabase = null" src/lib/supabase.js
          echo "Defensive Supabase initialization is present in source"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4